version: '3.8'

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: gnucash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gnucash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gnucash_secret}
      POSTGRES_DB: ${POSTGRES_DB:-gnucash}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gnucash -d gnucash"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gnucash-backend:latest
    container_name: gnucash-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gnucash}:${POSTGRES_PASSWORD:-gnucash_secret}@postgres:5432/${POSTGRES_DB:-gnucash}
      PORT: 8082
      RUST_LOG: info
      HOME: /home/kishan
    ports:
      - "${BACKEND_PORT:-8082}:8082"
    expose:
      - "8082"
    volumes:
      # Mount host codebase directory into container to allow detecting and importing .gnucash files
      - ../:/home/kishan/codebase:ro,z
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: gnucash-frontend:latest
    container_name: gnucash-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend

volumes:
  postgres-data:
