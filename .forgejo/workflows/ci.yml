name: Continuous Integration

on:
  push:
    branches: [master, main, 'refactor/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [master, main]

jobs:
  backend:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gnucash
          POSTGRES_PASSWORD: gnucash_secret
          POSTGRES_DB: gnucash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Cargo Clippy Check
        run: |
          cd backend
          cargo clippy --all-targets -- -D warnings

      - name: Cargo Test Suite
        env:
          DATABASE_URL: postgres://gnucash:gnucash_secret@localhost:5432/gnucash_test
          TEST_DATABASE_URL: postgres://gnucash:gnucash_secret@localhost:5432/gnucash_test
        run: |
          cd backend
          cargo test

  frontend:
    name: Frontend Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Typecheck TypeScript
        run: |
          cd frontend
          npm run typecheck

      - name: ESLint
        run: |
          cd frontend
          npm run lint

      - name: Unit Tests
        run: |
          cd frontend
          npm test

      - name: Production Build
        run: |
          cd frontend
          npm run build
